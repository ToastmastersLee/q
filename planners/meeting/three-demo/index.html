<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meeting room 3D</title>
    <link rel="stylesheet" href="../styles.css?v=20261122-studio" />
    <script defer src="../coverage.js?v=20261118-tabs"></script>
    <script defer src="../coverage-ui.js?v=20261118-pickup"></script>
    <script defer src="../common.js?v=20261118-tabs"></script>
    <script defer src="ifp-image.js"></script>
    <script defer src="app.js?v=20261122-studio"></script>
    <script defer src="../sidebar.js?v=20261118-tabs"></script>
  </head>
  <body class="meeting-3d">
    <header>
      <h1><span data-t="title"> </span> · 3D</h1>
      <label class="field">
        <span data-t="preset"> </span>
        <select id="preset">
          <option value="small">5 × 6 m</option>
          <option value="medium">6 × 8 m</option>
          <option value="standard" selected>8 × 10 m</option>
          <option value="large">10 × 14 m</option>
          <option value="custom" data-t="custom"></option>
        </select>
      </label>
      <label class="field">
        <span data-t="width"> </span>
        <input id="width" type="number" step="0.1" />
      </label>
      <label class="field">
        <span data-t="depth"> </span>
        <input id="depth" type="number" step="0.1" />
      </label>
      <label class="field">
        <span data-t="height"> </span>
        <input id="height" type="number" step="0.1" />
      </label>
      <button id="apply" class="primary" data-t="recalculate"></button>
      <button id="reset" data-t="reset"></button>
      <span class="header-spacer"> </span>
      <label class="field">
        <span data-t="language"> </span>
        <select id="language"></select>
      </label>
      <button id="sample-images" type="button" hidden>Sample images</button>
      <button id="export" class="primary" data-t="export"></button>
    </header>
    <main id="main">
      <section class="view" id="view">
        <span class="badge" id="dimensions"> </span>
        <div class="tools">
          <button data-view="overview" data-t="overview"></button>
          <button data-view="top" data-t="top"></button>
          <button data-view="front" data-t="front"></button>
          <button data-view="audience" data-t="audience"></button>
          <button id="collapse" data-t="hideSidebar"></button>
        </div>
        <canvas id="canvas3d"> </canvas>
        <div id="labels3d"></div>
      </section>
      <aside class="side" id="sidebar">
        <h2 id="side-heading" data-t="controls"></h2>
        <strong id="source"> </strong>
        <div class="tabs" role="tablist" aria-labelledby="side-heading">
          <button type="button" role="tab" id="tab-setup" aria-controls="pane-setup" aria-selected="true" tabindex="0" data-t="setupTab"></button>
          <button type="button" role="tab" id="tab-devices" aria-controls="pane-devices" aria-selected="false" tabindex="-1" data-t="devices"></button>
          <button type="button" role="tab" id="tab-coverage" aria-controls="pane-coverage" aria-selected="false" tabindex="-1" data-t="coverageTab"></button>
          <button type="button" role="tab" id="tab-display" aria-controls="pane-display" aria-selected="false" tabindex="-1" data-t="displayTab"></button>
        </div>
        <section class="pane" role="tabpanel" id="pane-setup" aria-labelledby="tab-setup" tabindex="0">
          <label class="field">
            <span data-t="displayLayout"> </span>
            <select id="display-layout">
              <option value="single" data-t="singleScreen"></option>
              <option value="front" data-t="frontScreens"></option>
              <option value="frontRear" data-t="frontRearScreens"></option>
              <option value="side" data-t="sideScreens"></option>
            </select>
          </label>
          <label class="field">
            <span data-t="door"> </span>
            <select id="door">
              <option value="right" data-t="right"></option>
              <option value="left" data-t="left"></option>
            </select>
          </label>
          <label class="field">
            <span data-t="doorCount"> </span>
            <select id="doorCount">
              <option value="1" data-t="oneDoor"></option>
              <option value="2" data-t="twoDoors"></option>
            </select>
          </label>
          <p class="hint" data-t="note"></p>
        </section>
        <section class="pane" role="tabpanel" id="pane-devices" aria-labelledby="tab-devices" tabindex="0" hidden>
          <label class="field">
            <span data-t="s350Count"> </span>
            <select id="s350-count">
              <option value="0">0</option>
              <option value="1" selected>1</option>
              <option value="2">2</option>
            </select>
          </label>
          <label class="field">
            <span data-t="penCount"> </span>
            <select id="pen-count"></select>
          </label>
          <p class="hint" data-t="dragDevice"></p>
          <div id="device-list" class="device-list"></div>
        </section>
        <section class="pane" role="tabpanel" id="pane-coverage" aria-labelledby="tab-coverage" tabindex="0" hidden>
          <section class="coverage" id="coverage"></section>
        </section>
        <section class="pane" role="tabpanel" id="pane-display" aria-labelledby="tab-display" tabindex="0" hidden>
          <select id="interior-view" hidden><option value=""></option><option value="front"></option><option value="reverse"></option><option value="entrance"></option></select>
            <label class="field">
            <span data-t="renderQuality"> </span>
            <select id="quality" disabled>
              <option value="standard" data-t="standardQuality"></option>
              <option value="high" data-t="highQuality"></option>
            </select>
          </label>
          <button id="theme" data-t="theme"></button>
          <label> <input type="checkbox" id="show-labels" checked /> <span data-t="labels"> </span> </label>
        </section>
        <p id="quality-status" class="hint" role="status" data-t="highUnavailable" hidden></p>
        <p id="error" role="alert"></p>
      </aside>
    </main>
  <dialog id="sample-dialog" aria-labelledby="sample-title"><h2 id="sample-title"></h2><img alt=""><nav>
          <button type="button" data-sample="front"></button><button type="button" data-sample="reverse"></button><button type="button" data-sample="entrance"></button>
          <a download></a><button class="sample-close" type="button"></button></nav></dialog>
  </body>
</html>
