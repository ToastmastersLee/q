<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meeting room</title>
    <link rel="stylesheet" href="styles.css?v=20261118-tabs" />
    <script defer src="coverage.js?v=20261118-tabs"></script>
    <script defer src="coverage-ui.js?v=20261118-pickup"></script>
    <script defer src="common.js?v=20261118-tabs"></script>
    <script defer src="plan-svg.js?v=20261118-tabs"></script>
    <script defer src="planner.js?v=20261118-tabs"></script>
    <script defer src="sidebar.js?v=20261118-tabs"></script>
  </head>
  <body>
    <header>
      <h1 data-t="title"></h1>
      <label class="field">
        <span data-t="preset"> </span>
        <select id="preset">
          <option value="small">5 × 6 m</option>
          <option value="medium">6 × 8 m</option>
          <option value="standard" selected>8 × 10 m</option>
          <option value="large">10 × 14 m</option>
          <option value="custom" data-t="custom"></option>
        </select>
      </label>
      <label class="field">
        <span data-t="width"> </span>
        <input id="width" type="number" step="0.1" />
      </label>
      <label class="field">
        <span data-t="depth"> </span>
        <input id="depth" type="number" step="0.1" />
      </label>
      <label class="field">
        <span data-t="height"> </span>
        <input id="height" type="number" step="0.1" />
      </label>
      <button id="apply" class="primary" data-t="recalculate"></button>
      <button id="reset" data-t="reset"></button>
      <span class="header-spacer"> </span>
      <label class="field">
        <span data-t="language"> </span>
        <select id="language"></select>
      </label>
      <button id="open3d" data-t="open3d"></button>
    </header>
    <main>
      <section class="view">
        <span class="badge" id="dimensions"> </span>
        <svg id="plan" role="img"></svg>
      </section>
      <aside class="side">
        <h2 id="side-heading" data-t="controls"></h2>
        <div class="tabs" role="tablist" aria-labelledby="side-heading">
          <button type="button" role="tab" id="tab-setup" aria-controls="pane-setup" aria-selected="true" tabindex="0" data-t="setupTab"></button>
          <button type="button" role="tab" id="tab-devices" aria-controls="pane-devices" aria-selected="false" tabindex="-1" data-t="devices"></button>
          <button type="button" role="tab" id="tab-coverage" aria-controls="pane-coverage" aria-selected="false" tabindex="-1" data-t="coverageTab"></button>
          <button type="button" role="tab" id="tab-display" aria-controls="pane-display" aria-selected="false" tabindex="-1" data-t="displayTab"></button>
        </div>
        <section class="pane" role="tabpanel" id="pane-setup" aria-labelledby="tab-setup" tabindex="0">
          <label>
            <span data-t="door"> </span>
            <select id="door">
              <option value="right" data-t="right"></option>
              <option value="left" data-t="left"></option>
            </select>
          </label>
          <label>
            <span data-t="doorCount"> </span>
            <select id="doorCount">
              <option value="1" data-t="oneDoor"></option>
              <option value="2" data-t="twoDoors"></option>
            </select>
          </label>
          <label><input id="table-size" type="checkbox" /> <span data-t="tableSize"></span></label>
          <output id="table-value" for="width depth"></output>
          <p class="hint" data-t="note"></p>
        </section>
        <section class="pane" role="tabpanel" id="pane-devices" aria-labelledby="tab-devices" tabindex="0" hidden>
          <label class="field">
            <span data-t="s350Count"> </span>
            <select id="s350-count">
              <option>0</option>
              <option selected>1</option>
              <option>2</option>
            </select>
          </label>
          <p class="hint" data-t="drag"></p>
          <button id="reset-table" data-t="resetTable" type="button"></button>
        </section>
        <section class="pane" role="tabpanel" id="pane-coverage" aria-labelledby="tab-coverage" tabindex="0" hidden>
          <section class="coverage" id="coverage"></section>
        </section>
        <section class="pane" role="tabpanel" id="pane-display" aria-labelledby="tab-display" tabindex="0" hidden>
          <button id="theme" data-t="theme"></button>
          <label><input id="show-labels" type="checkbox" checked /> <span data-t="labels"></span></label>
        </section>
        <p id="error" role="alert"></p>
      </aside>
    </main>
  </body>
</html>
